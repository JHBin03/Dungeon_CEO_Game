<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="마왕의 던전 운영 화면">
  <title>Dungeon CEO</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><span class="crest" aria-hidden="true">♜</span><h1>Dungeon <strong>CEO</strong></h1></div>
      <div class="gold"><span class="coin" aria-hidden="true">◆</span><span>보유 골드</span><strong id="gold"></strong></div>
    </div>
  </header>
  <main class="dashboard">
    <section class="frame dungeon" aria-labelledby="dungeon-title">
      <header class="section-head"><h2 id="dungeon-title">던전 전경</h2><span class="location">지하 1층</span></header>
      <div class="scene" role="img" aria-label="횃불이 타오르는 어두운 석조 왕좌의 방">
        <div class="scene-caption" aria-hidden="true"><span>THRONE ROOM</span><strong>마왕의 왕좌</strong></div>
      </div>
    </section>
    <aside class="frame management" aria-labelledby="management-title">
      <header class="section-head"><h2 id="management-title">운영 관리</h2></header>
      <div class="tabs" role="tablist" aria-label="운영 관리 메뉴">
        <button id="tab-dungeon" role="tab" aria-selected="true" aria-controls="panel-dungeon"><span aria-hidden="true">♜</span>던전</button>
        <button id="tab-monsters" role="tab" aria-selected="false" aria-controls="panel-monsters" tabindex="-1"><span aria-hidden="true">♞</span>몬스터</button>
        <button id="tab-traps" role="tab" aria-selected="false" aria-controls="panel-traps" tabindex="-1"><span aria-hidden="true">✥</span>함정</button>
      </div>
      <section class="tab-panel" id="panel-dungeon" role="tabpanel" aria-labelledby="tab-dungeon" tabindex="0"></section>
      <section class="tab-panel" id="panel-monsters" role="tabpanel" aria-labelledby="tab-monsters" tabindex="0" hidden></section>
      <section class="tab-panel" id="panel-traps" role="tabpanel" aria-labelledby="tab-traps" tabindex="0" hidden></section>
    </aside>
    <section class="frame journal" aria-labelledby="log-title">
      <header class="section-head"><h2 id="log-title">게임 로그</h2><span class="location">예시 기록</span></header>
      <ol class="log-list" id="logs"></ol>
    </section>
  </main>
  <template id="panel-template">
    <h3></h3><p class="panel-description"></p><dl class="stats"></dl>
  </template>
  <template id="stat-template">
    <div class="stat"><dt></dt><dd></dd></div>
  </template>
  <template id="log-template">
    <li class="log-entry"><time></time><span class="log-category"></span><span class="log-message"></span></li>
  </template>
</body>
</html>
